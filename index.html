<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Scenario Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="logo-icon">FS</div>
                <h1>Future Simulator</h1>
            </div>
            <div class="scenario-tabs" id="scenario-tabs">
                <!-- Tabs populated by JS -->
            </div>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Scenario Builder</h2>
                <button class="copy-scenario-btn" id="copy-scenario-btn">
                    Copy Scenario
                </button>
            </div>
            <div id="prompts-container">
                <!-- Prompts populated by JS -->
            </div>
        </aside>

        <main class="main-content">
            <div class="charts-grid" id="charts-grid">
                <div class="chart-card" id="asset-chart-card">
                    <div class="chart-header">
                        <div>
                            <div class="chart-title">Asset Worth Over Time</div>
                            <div class="chart-subtitle">Liquid securities, home equity, and charitable DAF</div>
                        </div>
                        <div class="chart-legend" id="asset-legend"></div>
                    </div>
                    <div class="chart-container" id="asset-chart"></div>
                </div>

                <div class="chart-card" id="spending-chart-card">
                    <div class="chart-header">
                        <div>
                            <div class="chart-title">Annual Cash Flow</div>
                            <div class="chart-subtitle">Income, expenses, and discretionary cash (click legend to filter)</div>
                        </div>
                        <div class="chart-legend" id="spending-legend"></div>
                    </div>
                    <div class="chart-container" id="spending-chart"></div>
                </div>

                <div class="chart-card" id="tax-chart-card">
                    <div class="chart-header">
                        <div>
                            <div class="chart-title">Taxes & Charitable Impact</div>
                            <div class="chart-subtitle">Tax burden, savings from donations, and capital gains avoided (FIFO)</div>
                        </div>
                        <div class="chart-legend" id="tax-legend"></div>
                    </div>
                    <div class="chart-container" id="tax-chart"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="app.js"></script>
</body>
</html>
